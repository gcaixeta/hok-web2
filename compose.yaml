services:
  mysql:
    image: mysql:8.4
    container_name: hok-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hokdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - hok-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  hok-mysql-data:
