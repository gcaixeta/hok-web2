<!doctype html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="ISO-8859-1" />
    <title>Cadastrar Projeto</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}">
  </head>
  <body>
    <div class="container top-padding">
      <a th:href="@{/project}">Home</a>
      <h1>Cadastrar Projeto</h1>
      <form
        action="#"
        th:action="@{/project/save}"
        th:object="${project}"
        method="POST"
      >
        <div class="form-group row">
          <label for="name" class="col-sm-2 col-form-label">Nome</label>
          <div class="col-sm-10">
            <input
              type="text"
              th:field="*{name}"
              class="form-control"
              id="name"
              name="name"
              placeholder="Digite o nome do projeto que está trabalhando"
            />
            <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="{*name}"></p>
          </div>
        </div>

        <div class="form-group row">
          <label for="symbol" class="col-sm-2 col-form-label">Sigla</label>
          <div class="col-sm-10">
            <input
              type="text"
              th:field="*{symbol}"
              class="form-control"
              id="symbol"
              name="symbol"
              placeholder="Digite a sigla do projeto"
            />
            <p th:if="${#fields.hasErrors('symbol')}" th:errorclass="text-danger" th:errors="{*symbol}"></p>
          </div>
        </div>

        <div class="form-group row">
          <label for="description" class="col-sm-2 col-form-label"
            >Descrição</label
          >
          <div class="col-sm-10">
            <textarea
              th:field="*{description}"
              class="form-control"
              id="description"
              name="description"
              rows="4"
              cols="50"
            />
          </div>
        </div>

        <button class="btn btn-info col-2" type="submit">Cadastrar</button>
      </form>
    </div>
  </body>
</html>
